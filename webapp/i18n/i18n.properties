action.PATCH=Update PHP to {0} or install the fixed package of your distribution.
action.RESTART=Then restart PHP-FPM, Apache (mod_php) or the container, otherwise the old code keeps running.
action.MITIGATE=If you cannot patch immediately: set memory_limit=-1 so applications cannot override it (e.g. php_admin_value) and limit request sizes at the web server; set session.upload_progress.enabled=0; on PHP 8.5 also fatal_error_backtraces=0. Restart all workers. This protection is incomplete.
action.LOCAL_CHECK=Check on the server: dpkg -l "php*" | grep ^ii (Debian/Ubuntu) or rpm -qa "php*" (RHEL family) and compare with your distribution advisory.
action.CHECK_ALL_NODES=Check every server and container behind this domain. This result only covers the node that answered.
action.EOL_UPGRADE=PHP 8.1 and older get no fixes from the PHP project, only from distributions or vendors. Plan the move to a supported branch.
action.HIDE_VERSION=Set expose_php=Off so the version is no longer published. This hides information, it does not fix the vulnerability.

note.REMOTE_LIMITS=A remote check is an indication, not proof: backports, mitigations and other nodes behind a load balancer are invisible from outside.
note.CDN=Reverse proxy or CDN detected ({0}). Headers may come from the edge rather than the PHP server.
note.TLS_LEGACY=The server only accepted an outdated TLS configuration (old protocol version or insecure renegotiation), so the check ran in compatibility mode. This points to an outdated server stack.
note.REDIRECTED=The request was redirected to {0}.
note.DATA_AS_OF=Fix data as of {0}.

footer.disclaimer=Passive check: one normal GET request like a browser, no exploit attempt.

# Server self-test
mode.selftest=Server self-test
selftest.intro=Exact check for sites you run yourself: a small PHP file prints version, server API and the settings named in the PHP advisories. The evaluation runs in your browser.
selftest.step1=1. Save this code as {0} in the web root of the site:
selftest.copy=Copy code
selftest.copied=Code copied
selftest.step2=2. Open the file in the browser, e.g. https://www.example.ch/{0}
selftest.step3=3. Paste the text shown there:
selftest.placeholder=PHP_VERSION = 8.3.6\nPHP_SAPI = fpm-fcgi\n...
selftest.step4=4. Delete the file immediately afterwards.
error.PASTED_CODE=This is the PHP code itself. Save it as a file on your server, open it in the browser and paste the text shown there. Use the mode "Server self-test".
error.SELFTEST_INVALID=Self-test output not recognised. Paste the complete text the file shows in the browser (it starts with PHP_VERSION = ...).
verdict.red.title.selftest=Affected
verdict.red.text.selftest=This PHP version is affected. Only an update fixes it completely; the findings show which attack paths are currently open.
verdict.orange.title.selftest=Patch level unclear
verdict.orange.text.selftest=This is a distribution build. Whether the fix was backported must be checked via the package version.
verdict.green.title.selftest=Patched
verdict.green.text.selftest=This PHP version contains the fix, and since the file ran on it, the running workers already use it.
finding.SELFTEST_FOUND=PHP {0} with server API {1}.
finding.A_RISK_HIGH=CVE-2026-109618 (out of memory): Apache mod_php is the setup where remote code execution was demonstrated.
finding.A_RISK_MEDIUM=CVE-2026-109618 (out of memory): For {0} no complete exploit has been shown so far, but according to the advisory the flaw is reachable.
finding.A_RISK_UNKNOWN=CVE-2026-109618 (out of memory): The advisory makes no statement about server API {0}.
finding.A_MEMORY_UNLIMITED=CVE-2026-109618: memory_limit is -1, the main configuration mitigation is active (incomplete protection).
finding.A_MEMORY_LIMITED=CVE-2026-109618: memory_limit is {0}, the configuration mitigation is not active.
finding.B_UPLOAD_ON=CVE-2026-109619 (stale state): session.upload_progress.enabled is on. This path was validated against mod_php and PHP-FPM.
finding.B_UPLOAD_OFF=CVE-2026-109619 (stale state): session.upload_progress.enabled is off, the session path is closed.
finding.B_BACKTRACES_ON=CVE-2026-109619: fatal_error_backtraces is on (PHP 8.5), the confirmed exploit path is open.
finding.B_BACKTRACES_OFF=CVE-2026-109619: fatal_error_backtraces is off.
finding.B_MODPHP_INI=CVE-2026-109619: With mod_php, warnings from .htaccess or php_value settings before request start are another confirmed path.
action.DELETE_FILE=Delete the self-test file now.
action.HOSTER=On shared hosting: switch to a patched PHP version in the hosting panel or ask your hoster when the patched builds are rolled out.
action.SELFTEST_UPLOAD_OFF=Set session.upload_progress.enabled=0 administratively (php.ini, PHP-FPM pool php_admin_value or the PHP settings of the hosting panel) and restart PHP. WordPress does not use this feature.
action.SELFTEST_BACKTRACES_OFF=Set fatal_error_backtraces=0 administratively and restart PHP.
action.SELFTEST_MEMORY=Optional: memory_limit=-1 as php_admin_value so that no plugin can override it, combined with request size limits at the web server. Incomplete protection.
action.SELFTEST_UPLOAD_KEEP_OFF=Recommended by the advisory even after patching: set session.upload_progress.enabled=0 if the site does not use upload progress (WordPress does not).
note.SELFTEST_SCOPE=The values apply to the PHP setup that ran the file. Other sites, PHP pools or servers must be checked separately.
