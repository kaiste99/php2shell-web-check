# English (default)
appTitle=PHP2Shell Web Check
appDescription=Passive check whether a web server may be affected by PHP2Shell (CVE-2026-109618, CVE-2026-109619)
intro=PHP2Shell (CVE-2026-109618, CVE-2026-109619) allows unauthenticated remote code execution in PHP. Fixed in PHP {0}. This check is passive: it only reads what the server sends to every visitor.
byline=by BALTX.COM

