finding.PHP_VERSION_FOUND=PHP-Version {0} im Header {1} gefunden.
finding.UPSTREAM_FIXED=Version {0} ist auf oder über dem Fix-Release {1}.
finding.NEWER_BRANCH=Version {0} gehört zu einem neueren Zweig als die Fix-Releases.
finding.UPSTREAM_BELOW_FIX=Version {0} liegt unter dem Fix-Release {1}.
finding.EOL_BRANCH=Version {0} gehört zu einem Zweig ohne Fixes vom PHP-Projekt (8.1 und älter).
finding.DISTRO_FIXED={0}: Paket {1} ist auf oder über dem Fix-Paket {2}.
finding.DISTRO_BELOW_FIX={0}: Paket {1} liegt unter dem Fix-Paket {2}.
finding.DISTRO_NO_FIX={0}: Paket {1}. Die Distribution hat noch keinen Fix veröffentlicht.
