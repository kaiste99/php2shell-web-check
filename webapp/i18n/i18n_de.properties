finding.BACKPORT_POSSIBLE=Die Upstream-Version {0} liegt unter dem Fix-Release, es handelt sich aber um einen Distributions- oder Hersteller-Build ({1}). Der Fix kann zurückportiert sein, das ist von aussen nicht erkennbar.
finding.MULTIPLE_VERSIONS=Entlang der Weiterleitungen wurden mehrere PHP-Versionen gesehen: {0}. Die schlechteste bestimmt das Ergebnis.
finding.PHP_NO_VERSION=PHP ist sehr wahrscheinlich im Einsatz ({0}), aber keine Version sichtbar.
finding.NO_PHP_SIGNAL=Keine PHP-Hinweise in Headern oder Seite gefunden.

action.PATCH=PHP auf {0} aktualisieren oder das gefixte Paket der Distribution installieren.
action.RESTART=Danach PHP-FPM, Apache (mod_php) bzw. den Container neu starten, sonst läuft der alte Code weiter.
action.MITIGATE=Falls der Patch nicht sofort möglich ist: memory_limit=-1 so setzen, dass Anwendungen es nicht überschreiben können (z.B. php_admin_value), und Request-Grössen am Webserver begrenzen; session.upload_progress.enabled=0; unter PHP 8.5 zusätzlich fatal_error_backtraces=0. Alle Worker neu starten. Dieser Schutz ist unvollständig.
action.LOCAL_CHECK=Auf dem Server prüfen: dpkg -l "php*" | grep ^ii (Debian/Ubuntu) bzw. rpm -qa "php*" (RHEL-Familie) und mit dem Advisory der Distribution vergleichen.
action.CHECK_ALL_NODES=Alle Server und Container hinter dieser Domain prüfen. Dieses Ergebnis gilt nur für den Knoten, der geantwortet hat.
action.EOL_UPGRADE=PHP 8.1 und älter bekommen vom PHP-Projekt keine Fixes mehr, nur noch über Distributionen oder Hersteller. Den Wechsel auf einen unterstützten Zweig planen.
action.HIDE_VERSION=expose_php=Off setzen, damit die Version nicht mehr veröffentlicht wird. Das verbirgt Information, es behebt die Lücke nicht.

note.REMOTE_LIMITS=Eine Remote-Prüfung ist ein Indiz, kein Beweis: Backports, Mitigations und weitere Knoten hinter einem Load-Balancer sind von aussen nicht sichtbar.
note.CDN=Reverse-Proxy oder CDN erkannt ({0}). Die Header können vom Edge stammen statt vom PHP-Server.
note.TLS_LEGACY=Der Server akzeptierte nur eine veraltete TLS-Konfiguration (alte Protokollversion oder unsichere Renegotiation), deshalb lief die Prüfung im Kompatibilitätsmodus. Das deutet auf einen veralteten Server-Stack hin.
note.REDIRECTED=Die Anfrage wurde nach {0} weitergeleitet.
note.DATA_AS_OF=Fix-Daten Stand {0}.

footer.disclaimer=Passiver Check: ein normaler GET-Request wie ein Browser, kein Exploit-Versuch.

# Server-Selbsttest
mode.selftest=Server-Selbsttest
selftest.intro=Exakter Check für Seiten, die du selbst betreibst: Eine kleine PHP-Datei gibt Version, Server-API und die in den PHP-Advisories genannten Einstellungen aus. Die Auswertung läuft in deinem Browser.
selftest.step1=1. Diesen Code als {0} ins Web-Verzeichnis der Seite legen:
selftest.copy=Code kopieren
selftest.copied=Code kopiert
selftest.step2=2. Die Datei im Browser öffnen, z.B. https://www.example.ch/{0}
selftest.step3=3. Den dort angezeigten Text hier einfügen:
selftest.placeholder=PHP_VERSION = 8.3.6\nPHP_SAPI = fpm-fcgi\n...
selftest.step4=4. Die Datei danach sofort löschen.
error.PASTED_CODE=Das ist der PHP-Code selbst. Speichere ihn als Datei auf deinem Server, öffne sie im Browser und füge den dort angezeigten Text ein. Nutze dafür den Modus «Server-Selbsttest».
error.SELFTEST_INVALID=Selbsttest-Ausgabe nicht erkannt. Bitte den kompletten Text einfügen, den die Datei im Browser anzeigt (er beginnt mit PHP_VERSION = ...).
verdict.red.title.selftest=Betroffen
verdict.red.text.selftest=Diese PHP-Version ist betroffen. Vollständig hilft nur ein Update; die Befunde zeigen, welche Angriffswege gerade offen sind.
verdict.orange.title.selftest=Patch-Stand unklar
verdict.orange.text.selftest=Es handelt sich um einen Distributions-Build. Ob der Fix zurückportiert ist, muss über die Paketversion geprüft werden.
verdict.green.title.selftest=Gepatcht
verdict.green.text.selftest=Diese PHP-Version enthält den Fix, und weil die Datei darauf lief, nutzen die laufenden Worker ihn bereits.
finding.SELFTEST_FOUND=PHP {0} mit Server-API {1}.
finding.A_RISK_HIGH=CVE-2026-109618 (Speicherüberlauf): Apache mod_php ist genau das Setup, für das Remote Code Execution nachgewiesen wurde.
finding.A_RISK_MEDIUM=CVE-2026-109618 (Speicherüberlauf): Für {0} wurde bisher kein vollständiger Exploit gezeigt, laut Advisory ist die Lücke aber erreichbar.
finding.A_RISK_UNKNOWN=CVE-2026-109618 (Speicherüberlauf): Zur Server-API {0} macht das Advisory keine Aussage.
finding.A_MEMORY_UNLIMITED=CVE-2026-109618: memory_limit ist -1, die wichtigste Konfigurations-Mitigation ist aktiv (unvollständiger Schutz).
finding.A_MEMORY_LIMITED=CVE-2026-109618: memory_limit ist {0}, die Konfigurations-Mitigation ist nicht aktiv.
finding.B_UPLOAD_ON=CVE-2026-109619 (liegengebliebener Zustand): session.upload_progress.enabled ist an. Dieser Weg ist gegen mod_php und PHP-FPM bestätigt.
finding.B_UPLOAD_OFF=CVE-2026-109619 (liegengebliebener Zustand): session.upload_progress.enabled ist aus, der Session-Weg ist zu.
finding.B_BACKTRACES_ON=CVE-2026-109619: fatal_error_backtraces ist an (PHP 8.5), der bestätigte Exploit-Weg ist offen.
finding.B_BACKTRACES_OFF=CVE-2026-109619: fatal_error_backtraces ist aus.
finding.B_MODPHP_INI=CVE-2026-109619: Bei mod_php sind Warnungen aus .htaccess- bzw. php_value-Einstellungen vor dem Request-Start ein weiterer bestätigter Weg.
action.DELETE_FILE=Die Selbsttest-Datei jetzt löschen.
action.HOSTER=Bei Shared Hosting: im Hosting-Panel auf eine gepatchte PHP-Version wechseln oder beim Hoster nachfragen, wann die gefixten Builds ausgerollt sind.
action.SELFTEST_UPLOAD_OFF=session.upload_progress.enabled=0 administrativ setzen (php.ini, php_admin_value im PHP-FPM-Pool oder PHP-Einstellungen im Hosting-Panel) und PHP neu starten. WordPress nutzt diese Funktion nicht.
action.SELFTEST_BACKTRACES_OFF=fatal_error_backtraces=0 administrativ setzen und PHP neu starten.
action.SELFTEST_MEMORY=Optional: memory_limit=-1 als php_admin_value, damit kein Plugin es überschreiben kann, zusammen mit Request-Grössen-Limits am Webserver. Unvollständiger Schutz.
action.SELFTEST_UPLOAD_KEEP_OFF=Vom Advisory auch nach dem Patch empfohlen: session.upload_progress.enabled=0 setzen, wenn die Seite keinen Upload-Fortschritt nutzt (WordPress tut das nicht).
note.SELFTEST_SCOPE=Die Werte gelten für das PHP-Setup, das die Datei ausgeführt hat. Andere Seiten, PHP-Pools oder Server separat prüfen.
