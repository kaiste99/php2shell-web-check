intro=PHP2Shell (CVE-2026-109618, CVE-2026-109619) erlaubt Remote Code Execution in PHP ohne Login. Behoben in PHP {0}. Dieser Check ist passiv: Er liest nur, was der Server jedem Besucher schickt.
