name: PHP2Shell Check

# Actions → "PHP2Shell Check" → "Run workflow" → URL eingeben.
# Das Ergebnis steht in der Zusammenfassung des Laufs.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Website-URL, z.B. https://www.example.ch"
        required: true
        type: string
      lang:
        description: "Sprache des Berichts"
        type: choice
        options: [de, en]
        default: de

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check
        env:
          # Inputs only via environment, never interpolated into the script
          TARGET_URL: ${{ inputs.url }}
          REPORT_LANG: ${{ inputs.lang }}
        run: |
          set +e
          node bin/check.js "$TARGET_URL" --lang "$REPORT_LANG" >> "$GITHUB_STEP_SUMMARY" 2> status.txt
          code=$?
          # status.txt holds our own token (result=… / error=…), filtered to be safe in annotations
          status=$(grep -E '^(result|error)=' status.txt | tail -n 1 | tr -cd 'A-Za-z0-9_=:')
          signals=$(grep '^signals=' status.txt | cut -c9- | tr -cd 'A-Za-z0-9 ._/:;=()+,~-' | cut -c1-600)
          [ -n "$signals" ] && echo "::notice title=PHP2Shell Signale::$signals"
          case "$code" in
            0) echo "::notice title=PHP2Shell::Kein Verdacht ($status). Details in der Zusammenfassung." ;;
            1) echo "::warning title=PHP2Shell::Unbestimmt, lokal prüfen ($status). Details in der Zusammenfassung." ;;
            2) echo "::error title=PHP2Shell::Verdacht auf Verwundbarkeit ($status). Details in der Zusammenfassung." ;;
            *) echo "::error title=PHP2Shell::Prüfung fehlgeschlagen ($status). Details in der Zusammenfassung."; exit 1 ;;
          esac
